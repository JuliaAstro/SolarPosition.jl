# slow government and DOI redirect sites regularly exceed the 20 s default and
# flake CI, for example doi.org and aa.usno.navy.mil
timeout = 60
max_retries = 4

exclude = [
  "@ref",
  "@cite",
  "^https://github.com/.*/releases/tag/v.*$",
  "^https://doi.org/FIXME$",
  "zenodo.org/badge/DOI/FIXME$",
  # These sites block automated requests (return 403 to the link checker)
  "^https://www\\.sciencedirect\\.com/.*$",
  "^https://www\\.timeanddate\\.com/.*$",
]

exclude_path = ["docs/build"]
